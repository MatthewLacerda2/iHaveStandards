name: frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "Makefile"
      - ".bun-version"
      - ".node-version"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "Makefile"
      - ".bun-version"
      - ".node-version"
      - ".github/workflows/frontend.yml"

env:
  HUSKY: 0

jobs:
  frontend:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # vitest and vite run under Node even when invoked through bun, and
      # jsdom 30 requires >=22.22.2 — so the runner's default Node is not
      # something we can leave to chance.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2
        with:
          # Single source of truth, so CI and local machines never drift.
          bun-version-file: .bun-version

      - name: Install dependencies
        run: cd frontend && bun install --frozen-lockfile

      - name: Run frontend gates
        run: make frontend
